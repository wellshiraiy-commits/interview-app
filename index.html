<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>面接練習アプリ（N5向け）</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
    }
    .phrase {
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 10px;
      background-color: #f9f9f9;
      margin-bottom: 10px;
    }
    .answer-text {
      font-size: 18px;
      color: blue;
      margin-top: 20px;
      display: none;
    }
    #completion {
      font-size: 22px;
      color: green;
      display: none;
    }
    button {
      padding: 10px 18px;
      font-size: 16px;
      margin: 8px;
    }
  </style>
</head>

<body>

<h1>面接（めんせつ）練習（れんしゅう）アプリ（N5）</h1>

<!-- スタート画面 -->
<div id="startScreen">
  <p>ボタンを押（お）して はじめてください</p>
  <button onclick="startApp()">スタート</button>
</div>

<div id="progress"></div>
<div id="question_area"></div>

<!-- 完了画面 -->
<div id="completion">
  <p>🎉 お疲（つか）れさまでした！練習（れんしゅう）完了（かんりょう）！</p>
  <button onclick="backToStart()">最初（さいしょ）にもどる</button>
</div>

<!-- ✅ スマホ対応の audio（1つだけ使い回す） -->
<audio id="audioPlayer" playsinline></audio>

<script>
  // ✅ audio を1つだけ定義
  const audioPlayer = document.getElementById("audioPlayer");

  const phrases = [
    { q: "こんにちは。お名前（なまえ）は？", a: "わたしは〇〇です。", file: "q1_name_n5.mp3" },
    { q: "どこから来（き）ましたか？", a: "〇〇から来ました。", file: "q2_from_n5.mp3" },
    { q: "お仕事（しごと）は何（なん）ですか？", a: "わたしは学生（がくせい）です。", file: "q3_job_n5.mp3" }
  ];

  let current = 0;

  // ✅ スタート時に音声ロック解除（最重要）
  function startApp(){
    audioPlayer.src = phrases[0].file;
    audioPlayer.play().catch(() => {});

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("completion").style.display = "none";
    showQuestion(0);
  }

  function showQuestion(index){
    current = index;
    const p = phrases[index];

    document.getElementById("progress").textContent =
      `質問 ${index + 1} / ${phrases.length}`;

    document.getElementById("question_area").innerHTML = `
      <div class="phrase">
        <p><strong>${p.q}</strong></p>
        <button onclick="playSound('${p.file}')">▶ 聞（き）く</button>
        <button onclick="showAnswer('${p.a}')">答（こた）えを見（み）る</button>
        <div class="answer-text" id="answer">${p.a}</div>
        <br>
        ${index > 0 ? `<button onclick="showQuestion(${index - 1})">前（まえ）へ</button>` : ""}
        ${index < phrases.length - 1
          ? `<button onclick="nextQuestion()">次（つぎ）へ</button>`
          : `<button onclick="finish()">終（お）わる</button>`
        }
      </div>
    `;
  }

  // ✅ 全音声再生はこれだけ使う
  function playSound(file){
    audioPlayer.src = file;
    audioPlayer.currentTime = 0;
    audioPlayer.play();
  }

  function showAnswer(text){
    document.getElementById("answer").style.display = "block";
  }

  function nextQuestion(){
    showQuestion(current + 1);
  }

  function finish(){
    document.getElementById("question_area").innerHTML = "";
    document.getElementById("progress").textContent = "";
    document.getElementById("completion").style.display = "block";
  }

  function backToStart(){
    document.getElementById("startScreen").style.display = "block";
    document.getElementById("completion").style.display = "none";
  }
</script>

</body>
</html>
